<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kese — Borç ve Ödeme Takibi</title>
  <meta name="description" content="Kredi kartları, taksitli ödemeler ve düzenli ödemeler için sade, çevrimdışı borç takibi.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080B10">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kese">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="apple-touch-startup-image" href="./icons/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="./icons/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-frame" id="appFrame">
    <div class="ambient" aria-hidden="true">
      <span class="ambient-glow ambient-glow--mint"></span>
      <span class="ambient-glow ambient-glow--sky"></span>
      <span class="ambient-grid"></span>
    </div>

    <header class="app-header">
      <button type="button" class="brand" data-action="go-tab" data-tab="genel" aria-label="Kese, genel bakışa git">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 7.6A2.6 2.6 0 0 1 7.1 5h9.2a2.2 2.2 0 0 1 2.2 2.2v.9"/>
            <rect x="2.8" y="7.3" width="18.4" height="12.1" rx="3.6"/>
            <path d="M15.8 11.6h5.4v3.9h-5.4a2 2 0 0 1 0-3.9Z"/>
            <circle cx="17" cy="13.55" r=".85" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="brand-copy">
          <span class="brand-name">Kese</span>
          <span class="brand-tag">BORÇ TAKİBİ</span>
        </span>
      </button>
      <button type="button" class="icon-btn" data-action="open-settings" aria-label="Ayarlar" title="Ayarlar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 15.3a3.3 3.3 0 1 0 0-6.6 3.3 3.3 0 0 0 0 6.6Z"/>
          <path d="M19.2 13.1c.1-.7.1-1.5 0-2.2l2-1.5-2-3.4-2.3 1a8 8 0 0 0-1.9-1.1L14.6 3h-4l-.5 2.9a8 8 0 0 0-1.9 1.1l-2.3-1-2 3.4 2 1.5a7.6 7.6 0 0 0 0 2.2l-2 1.5 2 3.4 2.3-1a8 8 0 0 0 1.9 1.1l.5 2.9h4l.5-2.9a8 8 0 0 0 1.9-1.1l2.3 1 2-3.4-2.1-1.5Z"/>
        </svg>
      </button>
    </header>

    <main class="view" id="view" tabindex="-1"></main>

    <nav class="tabbar" id="tabbar" aria-label="Ana menü">
      <button type="button" class="tab is-active" data-action="go-tab" data-tab="genel" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7.2" height="7.2" rx="2.2"/>
          <rect x="13.8" y="3" width="7.2" height="7.2" rx="2.2"/>
          <rect x="3" y="13.8" width="7.2" height="7.2" rx="2.2"/>
          <rect x="13.8" y="13.8" width="7.2" height="7.2" rx="2.2"/>
        </svg>
        <span>Genel</span>
      </button>
      <button type="button" class="tab" data-action="go-tab" data-tab="kartlar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="5" width="19" height="14" rx="3.5"/>
          <path d="M2.5 9.6h19"/>
          <path d="M6.2 15h3.1"/>
        </svg>
        <span>Kartlar</span>
      </button>
      <button type="button" class="tab" data-action="go-tab" data-tab="taksitler">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m12 3 9 4.7-9 4.7-9-4.7L12 3Z"/>
          <path d="m3 12.1 9 4.7 9-4.7"/>
          <path d="m3 16.4 9 4.7 9-4.7"/>
        </svg>
        <span>Taksitler</span>
      </button>
      <button type="button" class="tab" data-action="go-tab" data-tab="duzenli">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17.2 2.8 21 6.6l-3.8 3.8"/>
          <path d="M3 11.2V9.4A2.8 2.8 0 0 1 5.8 6.6H21"/>
          <path d="m6.8 21.2-3.8-3.8 3.8-3.8"/>
          <path d="M21 12.8v1.8a2.8 2.8 0 0 1-2.8 2.8H3"/>
        </svg>
        <span>Düzenli</span>
      </button>
    </nav>
  </div>

  <div id="overlayRoot"></div>
  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <div class="noscript">Kese'nin çalışması için tarayıcında JavaScript'in açık olması gerekiyor.</div>
  </noscript>

  <script src="./app.js" defer></script>
</body>
</html>
